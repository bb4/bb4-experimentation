plugins {
    id 'com.barrybecker4.bb4.scala-library' version '2.1-SNAPSHOT'
    id 'com.barrybecker4.bb4.publish' version '2.1-SNAPSHOT'
    id 'com.barrybecker4.bb4.application' version '2.1-SNAPSHOT'
}

description = 'Experimental apps and code'
group = 'com.barrybecker4'
version = '2.1-SNAPSHOT'

bb4 {
    archivesBaseName.set('bb4-experimentation')
    mainClass.set('com.barrybecker4.experimentation.axes.AxesSynchApp')
}

dependencies {
    implementation 'com.barrybecker4:bb4-math:2.1-SNAPSHOT'
    implementation 'com.barrybecker4:bb4-ui:2.1-SNAPSHOT'
    implementation 'com.barrybecker4:bb4-common:2.1-SNAPSHOT'
    implementation 'com.barrybecker4:bb4-sound:2.1-SNAPSHOT'
}

tasks.register('runGCF', JavaExec) {
    dependsOn classes
    standardInput = System.in
    group = 'application'
    mainClass = 'com.barrybecker4.experimentation.gcf.GcfProgram'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('runFactorizeApp', JavaExec) {
    dependsOn classes
    standardInput = System.in
    group = 'application'
    mainClass = 'com.barrybecker4.experimentation.factorize.PrimeFactorizeApp'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('runOnesAndZerosPuzzler', JavaExec) {
    dependsOn classes
    standardInput = System.in
    group = 'application'
    mainClass = 'com.barrybecker4.experimentation.puzzlers.OnesAndZerosPuzzler'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('runAxesSynch', JavaExec) {
    dependsOn classes
    group = 'application'
    mainClass = 'com.barrybecker4.experimentation.axes.AxesSynchApp'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('runReadNumber', JavaExec) {
    dependsOn classes
    standardInput = System.in
    group = 'application'
    mainClass = 'com.barrybecker4.experimentation.readnumber.ReadNumberApp'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('runSimpleEditor', JavaExec) {
    dependsOn classes
    group = 'application'
    mainClass = 'com.barrybecker4.experimentation.sedit.SimpleEditorFrame'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs = ['-ea']
}

tasks.register('runNativeRender', JavaExec) {
    dependsOn classes
    standardInput = System.in
    group = 'application'
    mainClass = 'com.barrybecker4.experimentation.nativerender.NativeRender'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs = ['-ea']
}

tasks.register('runXMLViewer', JavaExec) {
    dependsOn classes
    standardInput = System.in
    group = 'application'
    mainClass = 'com.barrybecker4.ui.xmlviewer.DomEcho'
    classpath = sourceSets.main.runtimeClasspath
    args = ['scala-source/com/barrybecker4/experimentation/yugioh/yugiohCards.xml']
}

tasks.register('runLineBreaks', JavaExec) {
    dependsOn classes
    group = 'application'
    mainClass = 'com.barrybecker4.experimentation.linebreaks.LineBreakSample'
    classpath = sourceSets.main.runtimeClasspath
}
